<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="#main">Home</a>
            <a href="#enroll">Enroll Here!</a>
        </nav>
    </header>

    <main id="main">
    <h1 class="center-text">This is the Home Page</h1>
    <img class="img center-img" src="https://static.vecteezy.com/system/resources/thumbnails/055/840/986/small/serene-sunset-sky-soft-pink-and-peach-cloudscape-photo.jpg" alt=" Pink sky during the sunset with clouds and calming vibes" width="900">
       
        <section class="section">
            <h2>Student Information table</h2>
            <table class="content-table">
                <caption>Record of current data</caption>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Course</th>
                    <th scope="col">Year</th>
                    <th scope="col">Section</th>
                </tr>
                <tr>
                    <td>Leigh Bautista</td>
                    <td>BSBAMMMD</td>
                    <td>2nd Year</td>
                    <td>DM21</td>
                </tr>
                <tr>
                    <td>Gabby Dela Cruz</td>
                    <td>BSBAMMMD</td>
                    <td>2nd Year</td>
                    <td>DM21</td>
                </tr>                
            </table>

            <article class="enroll" id="enroll">
                <h2>Input the necessary information for Enrollment</h2>
                <form class="infoform">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required><br>
                    <label for="number">Phone Number:</label>
                    <input type="number" id="number" required><br>  
                    <label for="email">Email ADdress:</label>
                    <input type="email" id="email" required><br>                                    
                    <button type="submit" id="btn">Enroll</button>
                </form>

            </article>

        </section>
    </main>

    <footer class="footer">
       <p>Purely made by Leigh Bautista 2026</p> 
    </footer>
</body>
</html>
